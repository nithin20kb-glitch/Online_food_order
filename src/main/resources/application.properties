# ==============================================================================
# FoodExpress - Online Food Ordering and Restaurant Management System
# Team-3 Software Engineering Project
# ==============================================================================

spring.application.name=FoodExpress
server.port=8080
server.servlet.context-path=/

# ------------------------------------------------------------------------------
# Primary Database Configuration: MySQL Database
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/foodexpress_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Template Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Session Management
server.servlet.session.timeout=60m
server.servlet.session.cookie.name=FOODEXPRESS_SESSION

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Multipart File Upload (for food images)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging Configuration
logging.level.com.foodexpress=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
