<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found – FoodExpress</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; background: #f8fafc;">

<div style="background: white; padding: 48px; border-radius: 16px; border: 1px solid #e2e8f0; max-width: 480px; box-shadow: var(--shadow-md);">
    <div style="font-size: 3.5rem; margin-bottom: 16px;">🍕</div>
    <h1 style="font-size: 2rem; font-weight: 800; color: var(--secondary); margin-bottom: 8px;">Page Not Found (404)</h1>
    <p style="color: var(--text-muted); margin-bottom: 24px;">The dish or page you are looking for has been moved or doesn't exist.</p>
    <a th:href="@{/}" class="btn btn-primary">Return to FoodExpress Home</a>
</div>

</body>
</html>
