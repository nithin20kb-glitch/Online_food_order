<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied – FoodExpress</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; background: #f8fafc;">

<div style="background: white; padding: 48px; border-radius: 16px; border: 1px solid #e2e8f0; max-width: 480px; box-shadow: var(--shadow-md);">
    <div style="font-size: 3.5rem; margin-bottom: 16px;">🚫</div>
    <h1 style="font-size: 2rem; font-weight: 800; color: var(--secondary); margin-bottom: 8px;">Access Denied (403)</h1>
    <p style="color: var(--text-muted); margin-bottom: 24px;">You do not have administrative permissions to access this page.</p>
    <div style="display: flex; gap: 12px; justify-content: center;">
        <a th:href="@{/}" class="btn btn-primary">Return to Home</a>
        <a th:href="@{/admin/login}" class="btn btn-outline">Admin Log In</a>
    </div>
</div>

</body>
</html>
