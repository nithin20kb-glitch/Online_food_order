<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login – FoodExpress</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background-color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh;">

<div style="width: 100%; max-width: 440px; padding: 20px;">
    <div style="background: white; border-radius: 16px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 60px; height: 60px; background: rgba(255, 71, 87, 0.1); color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 12px;">
                ⚡
            </div>
            <h1 style="font-size: 1.6rem; font-weight: 800; color: #0f172a;">FoodExpress Admin</h1>
            <p style="color: #64748b; font-size: 0.85rem; margin-top: 4px;">Restaurant Management &amp; Dispatch Portal</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger" style="font-size: 0.85rem;">
            Invalid administrative credentials.
        </div>

        <!-- Quick Credentials Chip -->
        <div class="demo-credentials-badge" style="margin-bottom: 20px;">
            <strong style="color: var(--secondary); display: block; margin-bottom: 4px;">Default Admin Credentials:</strong>
            <div style="font-size: 0.85rem; font-family: monospace;">
                Email: <strong>admin@foodexpress.com</strong><br>
                Password: <strong>admin123</strong>
            </div>
            <button type="button" class="btn btn-outline btn-sm" style="margin-top: 8px; width: 100%;"
                    onclick="document.getElementById('adminEmail').value='admin@foodexpress.com'; document.getElementById('adminPassword').value='admin123';">
                1-Click Quick Fill Admin
            </button>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label">Admin Email</label>
                <input type="email" id="adminEmail" name="email" class="form-control" placeholder="admin@foodexpress.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="adminPassword" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                Authenticate &amp; Enter Dashboard &rarr;
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center;">
            <a th:href="@{/}" style="color: var(--text-muted); font-size: 0.85rem;">&larr; Return to Customer Website</a>
        </div>
    </div>
</div>

</body>
</html>
