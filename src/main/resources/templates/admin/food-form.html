<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Food Item' : 'Add New Food Item'} + ' – FoodExpress Admin'">Food Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

<div th:replace="~{admin/sidebar :: sidebar('foods')}"></div>

<main class="admin-main">
    <div class="admin-header">
        <div>
            <h1 class="admin-title" th:text="${isEdit ? 'Edit Food Item' : 'Add New Food Item'}">Food Form</h1>
            <p style="color: var(--admin-text-muted); font-size: 0.95rem;">Fill in the menu details, pricing, and category configuration</p>
        </div>
        <a th:href="@{/admin/foods}" class="btn btn-outline btn-sm">
            &larr; Back to Foods List
        </a>
    </div>

    <div style="background: white; border-radius: 12px; border: 1px solid var(--admin-border); padding: 32px; max-width: 800px;">
        <form th:action="@{/admin/foods/save}" th:object="${foodItem}" method="post">
            <input type="hidden" th:field="*{id}">

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label class="form-label">Dish Name *</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Tandoori Chicken Tikka" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Price (₹) *</label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control" placeholder="299.00" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label class="form-label">Category *</label>
                    <select name="categoryId" class="form-control" required>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${foodItem.category != null and foodItem.category.id == cat.id}">
                            Category
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Kitchen / Restaurant *</label>
                    <select name="restaurantId" class="form-control" required>
                        <option th:each="rest : ${restaurants}"
                                th:value="${rest.id}"
                                th:text="${rest.name + ' (' + rest.locationArea + ')'}"
                                th:selected="${foodItem.restaurant != null and foodItem.restaurant.id == rest.id}">
                            Restaurant
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Food Image URL</label>
                <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://images.unsplash.com/photo-...">
                <small style="color: var(--text-muted); font-size: 0.8rem;">Enter a high-resolution Unsplash or direct image URL</small>
            </div>

            <div class="form-group">
                <label class="form-label">Description &amp; Ingredients *</label>
                <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Describe the ingredients, spices, and serving portions..." required></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: center; background: #f8fafc; padding: 18px; border-radius: var(--radius-md); margin-bottom: 24px;">
                <div>
                    <label class="form-label">Preparation Time (Mins)</label>
                    <input type="number" th:field="*{preparationTimeMinutes}" class="form-control" min="5" max="90" value="20">
                </div>

                <div>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; margin-top: 20px;">
                        <input type="checkbox" th:field="*{vegetarian}" style="width: 18px; height: 18px; accent-color: #2ed573;">
                        <span>🌱 Vegetarian</span>
                    </label>
                </div>

                <div>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; margin-top: 20px;">
                        <input type="checkbox" th:field="*{featured}" style="width: 18px; height: 18px; accent-color: #ffa502;">
                        <span>⭐ Chef's Featured</span>
                    </label>
                </div>
            </div>

            <div style="display: flex; gap: 14px;">
                <button type="submit" class="btn btn-primary btn-lg">
                    💾 Save Food Item
                </button>
                <a th:href="@{/admin/foods}" class="btn btn-outline btn-lg">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
