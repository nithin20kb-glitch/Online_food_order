<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In – FoodExpress</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="auth-card">
        <div class="auth-header">
            <span style="font-size: 2.5rem; display: block; margin-bottom: 8px;">🍔</span>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Log in to order food, track deliveries, and manage your account</p>
        </div>

        <!-- Flash alerts -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${logoutMessage}" class="alert alert-success" th:text="${logoutMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <!-- Quick Demo Credentials Chips for College Demonstration -->
        <div class="demo-credentials-badge">
            <strong style="color: var(--secondary); display: block; margin-bottom: 6px;">⚡ Demo Quick Fill (Click to populate):</strong>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button type="button" class="btn btn-outline btn-sm"
                        onclick="document.getElementById('loginEmail').value='admin@foodexpress.com'; document.getElementById('loginPassword').value='admin123';">
                    🔑 Admin Account
                </button>
                <button type="button" class="btn btn-outline btn-sm"
                        onclick="document.getElementById('loginEmail').value='rahul@example.com'; document.getElementById('loginPassword').value='password123';">
                    👤 Customer Account
                </button>
            </div>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="loginEmail" name="email" class="form-control" placeholder="name@example.com" required autofocus>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between;">
                    <label class="form-label">Password</label>
                </div>
                <input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                Log In &rarr;
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account yet?
            <a th:href="@{/register}" style="color: var(--primary); font-weight: 700;">Sign up here</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
