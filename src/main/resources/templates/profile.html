<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile – FoodExpress</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" style="padding: 40px 20px;">
    <!-- Flash Alerts -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div style="max-width: 640px; margin: 0 auto; background: white; padding: 36px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 28px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px;">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 800;">
                👤
            </div>
            <div>
                <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--secondary);" th:text="${user.fullName}">User Name</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;" th:text="${user.email}">user@example.com</p>
            </div>
        </div>

        <form th:action="@{/profile/update}" method="post">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="fullName" th:value="${user.fullName}" class="form-control" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address (Read-only)</label>
                <input type="email" th:value="${user.email}" class="form-control" style="background-color: #f1f5f9; cursor: not-allowed;" readonly>
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" th:value="${user.phone}" class="form-control" required>
            </div>

            <div class="form-group">
                <label class="form-label">Default Delivery Street Address</label>
                <input type="text" name="deliveryAddress" th:value="${user.deliveryAddress}" class="form-control" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label">City / Delivery Area</label>
                    <input type="text" name="city" th:value="${user.city}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label class="form-label">PIN / Postal Code</label>
                    <input type="text" name="postalCode" th:value="${user.postalCode}" class="form-control" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                💾 Save Changes
            </button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
