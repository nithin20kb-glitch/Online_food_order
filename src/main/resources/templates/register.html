<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration – FoodExpress</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" style="padding: 30px 20px;">
    <div class="auth-card" style="max-width: 580px;">
        <div class="auth-header">
            <span style="font-size: 2.5rem; display: block; margin-bottom: 8px;">🍽️</span>
            <h1 class="auth-title">Create an Account</h1>
            <p class="auth-subtitle">Join FoodExpress for instant restaurant orders and fast delivery</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" th:object="${userDto}" method="post">
            <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. Rahul Sharma">
                <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="form-error"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="rahul@example.com">
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number *</label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="10-digit number">
                    <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="form-error"></div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="At least 6 characters">
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password *</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Repeat password">
                    <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="form-error"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Default Delivery Street Address *</label>
                <input type="text" th:field="*{deliveryAddress}" class="form-control" placeholder="House/Flat number, Street name">
                <div th:if="${#fields.hasErrors('deliveryAddress')}" th:errors="*{deliveryAddress}" class="form-error"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label">City / Delivery Area *</label>
                    <input type="text" th:field="*{city}" class="form-control" placeholder="e.g. Indiranagar, Metro City">
                    <div th:if="${#fields.hasErrors('city')}" th:errors="*{city}" class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">PIN / Postal Code *</label>
                    <input type="text" th:field="*{postalCode}" class="form-control" placeholder="6-digit PIN">
                    <div th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}" class="form-error"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                Register Account &rarr;
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account?
            <a th:href="@{/login}" style="color: var(--primary); font-weight: 700;">Log in here</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
